<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Pasarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <section id="login-view" class="login-view">
    <form id="login-form" class="login-card brutal">
      <div class="logo" style="margin-bottom:20px;">PASARIN ADMIN</div>
      <h1>Masuk ke Admin Panel</h1>
      <p class="login-sub">Khusus akun dengan role admin.</p>

      <label class="field">
        <span>Email</span>
        <input type="email" id="login-email" required autocomplete="username">
      </label>
      <label class="field">
        <span>Kata sandi</span>
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>

      <p id="login-error" class="login-error" style="display:none;"></p>

      <button type="submit" class="btn btn-green brutal hover-lift" style="width:100%;">Masuk</button>
      <a href="index.html" class="back-link">← Kembali ke beranda</a>
    </form>
  </section>

  <!-- DASHBOARD (baru tampil setelah role admin terverifikasi) -->
  <section id="dashboard-view" class="dashboard-view hidden">
    <header class="admin-header">
      <div class="logo">PASARIN ADMIN</div>
      <div class="admin-header-right">
        <span id="admin-name" class="admin-name mono"></span>
        <button id="logout-btn" class="btn btn-ink brutal-sm hover-lift-sm" type="button">Keluar</button>
      </div>
    </header>

    <main class="admin-main">

      <!-- BANNER -->
      <section class="admin-panel brutal">
        <h2>Banner Berjalan</h2>
        <p class="panel-sub">Teks yang tampil di pita banner paling atas halaman utama.</p>
        <form id="banner-form" class="inline-form">
          <input type="text" id="banner-input" placeholder="Tulis pesan banner..." required>
          <button type="submit" class="btn btn-green brutal-sm">Tambah</button>
        </form>
        <div id="banner-list" class="admin-list"></div>
      </section>

      <!-- KATEGORI -->
      <section class="admin-panel brutal">
        <h2>Kategori</h2>
        <p class="panel-sub">Kategori dipakai sebagai filter chip di halaman utama.</p>
        <form id="category-form" class="inline-form">
          <input type="text" id="category-input" placeholder="Nama kategori..." required>
          <button type="submit" class="btn btn-green brutal-sm">Tambah</button>
        </form>
        <div id="category-list" class="admin-list"></div>
      </section>

      <!-- PRODUK -->
      <section class="admin-panel brutal">
        <h2>Produk</h2>
        <p class="panel-sub">Produk yang tampil di grid halaman utama.</p>
        <form id="product-form" class="product-form">
          <div class="form-grid">
            <label class="field"><span>Nama produk</span><input type="text" id="product-name" required></label>
            <label class="field"><span>Nama toko</span><input type="text" id="product-shop" required></label>
            <label class="field"><span>Harga (Rp)</span><input type="number" id="product-price" min="0" required></label>
            <label class="field"><span>Harga coret (opsional)</span><input type="number" id="product-old-price" min="0"></label>
            <label class="field"><span>Ikon / emoji</span><input type="text" id="product-icon" placeholder="📦" maxlength="4"></label>
            <label class="field"><span>Kategori</span><select id="product-category"></select></label>
            <label class="field"><span>Label (opsional)</span><input type="text" id="product-badge" placeholder="Diskon / Baru"></label>
          </div>
          <button type="submit" class="btn btn-green brutal-sm">Tambah Produk</button>
        </form>
        <div id="product-list" class="admin-list"></div>
      </section>

    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
