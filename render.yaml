services:
  - type: web
    name: upgit-server
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: upgit_session
      - key: SESSION_TTL_HOURS
        value: 168
      - key: UPLOAD_MAX_SIZE
        value: 52428800
      - key: MAX_FILES
        value: 2000
      - key: MAX_EXTRACTED_SIZE
        value: 209715200

  - type: web
    name: upgit-client
    runtime: static
    rootDir: client
    buildCommand: ""
    staticPublishPath: .
    # Hash-based client routing (#/upload, #/settings, ...) never hits the
    # server, so no SPA catch-all rewrite is needed here.
