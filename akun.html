<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akun Saya — EX-SCHOOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="admin.css?v=2">
</head>
<body class="admin-body">

  <!-- AUTH: tab Masuk / Daftar -->
  <section id="auth-view" class="login-view">
    <div class="login-card brutal">
      <div class="logo" style="margin-bottom:20px;">EX-SCHOOL</div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">Masuk</button>
        <button type="button" class="auth-tab" data-tab="register">Daftar</button>
      </div>

      <!-- FORM MASUK -->
      <form id="login-form" class="auth-form">
        <h1>Masuk ke akunmu</h1>
        <p class="login-sub">Belum punya akun? Klik tab "Daftar" di atas.</p>

        <label class="field">
          <span>Email</span>
          <input type="email" id="login-email" required autocomplete="username">
        </label>
        <label class="field">
          <span>Kata sandi</span>
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>

        <p id="login-error" class="login-error" style="display:none;"></p>
        <button type="submit" class="btn btn-green brutal hover-lift" style="width:100%;">Masuk</button>
      </form>

      <!-- FORM DAFTAR -->
      <form id="register-form" class="auth-form hidden">
        <h1>Buat akun baru</h1>
        <p class="login-sub">Akun baru otomatis role Member.</p>

        <label class="field">
          <span>Nama lengkap</span>
          <input type="text" id="register-name" required autocomplete="name">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="register-email" required autocomplete="username">
        </label>
        <label class="field">
          <span>Kata sandi</span>
          <input type="password" id="register-password" required autocomplete="new-password" minlength="6">
        </label>

        <p id="register-error" class="login-error" style="display:none;"></p>
        <button type="submit" class="btn btn-green brutal hover-lift" style="width:100%;">Daftar</button>
      </form>

      <a href="index.html" class="back-link">← Kembali ke beranda</a>
    </div>
  </section>

  <!-- PROFIL (setelah login) -->
  <section id="profile-view" class="login-view hidden">
    <div class="login-card brutal">
      <div class="logo" style="margin-bottom:20px;">EX-SCHOOL</div>
      <h1 id="profile-name">Halo!</h1>
      <p class="login-sub" id="profile-email"></p>
      <span id="profile-role-badge" class="role-badge"></span>

      <div id="profile-admin-link" class="hidden" style="margin-top:20px;">
        <a href="admin.html" class="btn btn-blue brutal hover-lift" style="width:100%; display:block; text-align:center; box-sizing:border-box;">Buka Admin Panel →</a>
      </div>
      <div id="profile-cs-link" class="hidden" style="margin-top:14px;">
        <a href="cs.html" class="btn btn-green brutal hover-lift" style="width:100%; display:block; text-align:center; box-sizing:border-box;">Buka CS Panel →</a>
      </div>

      <!-- FORM UBAH PROFIL: nama, email (gmail dll), kontak opsional -->
      <form id="profile-edit-form" class="auth-form" style="margin-top:22px; padding-top:20px; border-top:2.5px solid var(--ink);">
        <h2 style="margin:0 0 4px;">Ubah profil</h2>
        <p class="login-sub" style="margin-top:0;">Nama & email wajib diisi. Kontak di bawah opsional.</p>

        <label class="field">
          <span>Nama lengkap</span>
          <input type="text" id="profile-edit-name" required autocomplete="name">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="profile-edit-email" required autocomplete="username">
        </label>
        <label class="field">
          <span>Nomor WhatsApp (opsional)</span>
          <input type="tel" id="profile-edit-phone" autocomplete="tel" placeholder="08xxxxxxxxxx">
        </label>
        <label class="field">
          <span>Kontak lain (opsional)</span>
          <input type="text" id="profile-edit-other-contact" placeholder="Instagram, Telegram, dll">
        </label>

        <p id="profile-edit-error" class="login-error" style="display:none;"></p>
        <p id="profile-edit-success" class="login-sub" style="display:none; color:#1a7d3a; font-weight:700;"></p>
        <button type="submit" class="btn btn-blue brutal hover-lift" style="width:100%;">Simpan Perubahan</button>
      </form>

      <button id="logout-btn" class="btn btn-ink brutal hover-lift" style="width:100%; margin-top:14px;" type="button">Keluar</button>
      <a href="index.html" class="back-link">← Kembali ke beranda</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="akun.js"></script>
</body>
</html>
